name: Agent-Gate

# Prueft Agenten-PRs (Autor github-actions[bot] oder die eigene Mini-App) nach jedem abgeschlossenen CI-Lauf und aktiviert dann
# GitHub-Auto-Merge, aber nur wenn das Repo Auto-Merge erlaubt (allow_auto_merge); sonst bleibt der PR unberuehrt. Trigger workflow_run, weil per GITHUB_TOKEN erzeugte PRs kein pull_request_target
# ausloesen (belegt in ch-import #24/#25: 0 Laeufe). Fuehrt NIE Code oder Artefakte aus dem PR aus:
# kein Checkout, nur API-Aufrufe. Alles Wesentliche (Lauf, PR, Autor, HEAD, Pflicht-Check) wird
# unabhaengig ueber die GitHub-API geprueft, nicht dem Ereignis geglaubt.
# Setzt pro Commit den Check-Run "agent-gate" (success/failure); er ist im Ruleset main-schutz Pflicht-Check.
# Fehlt er (Gate lief nicht / neuer HEAD), ist der Merge blockiert.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: agent-gate-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      checks: write
      contents: write
      pull-requests: write
    steps:
      - name: Pruefen und Auto-Merge aktivieren
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import shlex
          import subprocess
          import sys

          GH = shlex.split(os.environ.get("GH_BIN", "gh"))
          REPO = os.environ["REPO"]
          RUN_ID = os.environ["RUN_ID"]
          HEAD_SHA = os.environ["HEAD_SHA"]
          # Erlaubte Bot-Autoren: gh-aw-Standard und die eigene Mini-App (Slug nach App-Anlage eintragen).
          AGENT_AUTHORS = ("github-actions[bot]", "ai-projects-agent-pr[bot]")
          CI_NAME = "CI"
          CI_PFAD = ".github/workflows/ci.yml"
          PFLICHT_CHECK = "test"
          CHECK_NAME = "agent-gate"  # wird im Ruleset Pflicht-Check (App 15368)
          PFLICHT_APP_ID = 15368  # GitHub Actions

          ERLAUBT = re.compile(r"^(src|tests)/")
          MAX_ZEILEN = 800
          MAX_DATEIEN = 50
          TEST_SKIP = re.compile(
              r"pytest\.mark\.(skip|skipif|xfail)|pytest\.(skip|xfail)\(|importorskip|unittest\.skip"
          )
          SRC_RISIKO = re.compile(
              r"^\s*(import|from)\s+(socket|requests|urllib|http|ftplib|smtplib|subprocess|ctypes"
              r"|multiprocessing|pickle|shelve)\b|os\.(system|popen)|\beval\(|\bexec\(|__import__"
          )
          ASSERT = re.compile(r"^\s*(assert\b|with\s+pytest\.raises|def\s+test_)")


          def gh(*args, fatal=True):
              r = subprocess.run([*GH, *args], capture_output=True, text=True)
              if r.returncode != 0:
                  print(f"gh {' '.join(args)} endete mit Code {r.returncode}: {r.stderr.strip()}")
                  if fatal:
                      sys.exit(1)
              return r.stdout


          def s(text):
              # Workflow-Befehle (::...::) aus fremden Texten im Log unschaedlich machen.
              return str(text).replace("::", ": :")


          def json_folge(text):
              teile, dec, i = [], json.JSONDecoder(), 0
              while i < len(text):
                  if text[i].isspace():
                      i += 1
                      continue
                  obj, i = dec.raw_decode(text, i)
                  teile.append(obj)
              return teile


          def bewerte(pr, dateien):
              """Gibt die Liste der Verstoesse zurueck; leer = Aenderung zulaessig."""
              v = []
              if not pr["title"].startswith("[agent] "):
                  v.append("Titel ohne Praefix '[agent] '")
              if pr["additions"] + pr["deletions"] > MAX_ZEILEN:
                  v.append(f"zu gross: {pr['additions'] + pr['deletions']} Zeilen (max {MAX_ZEILEN})")
              if len(dateien) > MAX_DATEIEN:
                  v.append(f"zu viele Dateien: {len(dateien)} (max {MAX_DATEIEN})")
              entfernt = hinzu = 0
              for d in dateien:
                  pfade = [d["filename"]] + ([d["previous_filename"]] if d.get("previous_filename") else [])
                  for p in pfade:
                      if not ERLAUBT.match(p) or "/../" in p or p.startswith("../"):
                          v.append(f"Datei ausserhalb src/ und tests/: {s(p)}")
                  name = d["filename"]
                  if d["status"] == "removed" and name.startswith("tests/"):
                      v.append(f"Testdatei geloescht: {s(name)}")
                  if d["status"] != "removed" and not d.get("patch"):
                      v.append(f"kein pruefbarer Patch (binaer oder zu gross): {s(name)}")
                  for zeile in (d.get("patch") or "").splitlines():
                      if zeile.startswith("+"):
                          inhalt = zeile[1:]
                          if name.startswith("tests/") and TEST_SKIP.search(inhalt):
                              v.append(f"Test uebersprungen/xfail in {s(name)}: {s(inhalt.strip())}")
                          if name.startswith("src/") and SRC_RISIKO.search(inhalt):
                              v.append(f"riskanter Aufruf/Import in {s(name)}: {s(inhalt.strip())}")
                      if name.startswith("tests/") and ASSERT.match(zeile[1:]):
                          if zeile.startswith("-"):
                              entfernt += 1
                          elif zeile.startswith("+"):
                              hinzu += 1
              if entfernt > hinzu:
                  v.append(f"Assertions/Tests netto reduziert: {entfernt} entfernt, {hinzu} hinzugefuegt")
              return v


          ERGEBNIS = {"text": "", "melden": False}


          def stopp(text):
              print(f"STOPP: {s(text)}")
              ERGEBNIS["text"] = f"STOPP: {s(text)}"
              return 1


          def melde(conclusion, text):
              """Setzt den Check-Run agent-gate fuer genau diesen Commit (fehlt er, ist der Merge blockiert)."""
              felder = ["-f", "status=completed", "-f", f"conclusion={conclusion}",
                        "-f", f"output[title]=Agent-Gate: {conclusion}", "-f", f"output[summary]={s(text)[:900]}"]
              vorhanden = [c for teil in json_folge(gh("api", "--paginate",
                                                       f"repos/{REPO}/commits/{HEAD_SHA}/check-runs?check_name={CHECK_NAME}"))
                           for c in teil["check_runs"]
                           if c["name"] == CHECK_NAME and c["app"]["id"] == PFLICHT_APP_ID]
              if vorhanden:
                  gh("api", "-X", "PATCH", f"repos/{REPO}/check-runs/{vorhanden[-1]['id']}", *felder)
              else:
                  gh("api", "-X", "POST", f"repos/{REPO}/check-runs", "-f", f"name={CHECK_NAME}",
                     "-f", f"head_sha={HEAD_SHA}", *felder)


          def pruefe():
              lauf = json.loads(gh("api", f"repos/{REPO}/actions/runs/{RUN_ID}"))
              if lauf["repository"]["full_name"] != REPO or lauf["name"] != CI_NAME or lauf["path"] != CI_PFAD:
                  return stopp("kein CI-Lauf dieses Repos")
              if lauf["event"] != "pull_request" or lauf["status"] != "completed":
                  print("Kein abgeschlossener Pull-Request-CI-Lauf: uebersprungen.")
                  return 0
              if lauf["head_sha"] != HEAD_SHA or lauf["head_repository"]["full_name"] != REPO:
                  return stopp("Lauf passt nicht zum Ereignis oder stammt aus einem Fork")
              if lauf["conclusion"] in ("cancelled", "skipped", "action_required", "stale"):
                  print(f"CI-Lauf {lauf['conclusion']}: nichts zu tun.")
                  return 0
              ERGEBNIS["melden"] = True
              if lauf["conclusion"] != "success":
                  return stopp(f"CI-Lauf nicht erfolgreich ({lauf['conclusion']})")
              zuordnung = lauf.get("pull_requests") or []
              if len(zuordnung) != 1:
                  return stopp(f"CI-Lauf ist nicht genau einem PR zugeordnet ({len(zuordnung)})")
              pr_nr = str(zuordnung[0]["number"])
              pr = json.loads(gh("api", f"repos/{REPO}/pulls/{pr_nr}"))
              if pr["user"]["login"] not in AGENT_AUTHORS or pr["user"]["type"] != "Bot":
                  print(f"Kein Agenten-PR (Autor {s(pr['user']['login'])}): uebersprungen.")
                  ERGEBNIS["text"] = f"Kein Agenten-PR (Autor {s(pr['user']['login'])}): nicht zustaendig."
                  return 0
              repo = json.loads(gh("api", f"repos/{REPO}"))
              standard = repo["default_branch"]
              if (pr["state"] != "open" or pr["head"]["repo"]["full_name"] != REPO
                      or pr["base"]["repo"]["full_name"] != REPO or pr["base"]["ref"] != standard):
                  return stopp("PR nicht offen, aus Fork oder nicht gegen den Standard-Branch")
              if pr["head"]["sha"] != HEAD_SHA:
                  return stopp("HEAD hat sich seit dem CI-Lauf geaendert; der neue CI-Lauf loest eine neue Pruefung aus")
              checks = [c for teil in json_folge(gh("api", "--paginate", f"repos/{REPO}/commits/{HEAD_SHA}/check-runs"))
                        for c in teil["check_runs"]]
              pflicht = [c for c in checks if c["name"] == PFLICHT_CHECK and c["app"]["id"] == PFLICHT_APP_ID]
              if len(pflicht) != 1 or pflicht[0]["conclusion"] != "success" or pflicht[0]["head_sha"] != HEAD_SHA:
                  return stopp(f"Pflicht-Check '{PFLICHT_CHECK}' nicht genau einmal erfolgreich")
              dateien = [x for teil in json_folge(gh("api", "--paginate", f"repos/{REPO}/pulls/{pr_nr}/files"))
                         for x in teil]
              verstoesse = bewerte(pr, dateien)
              if verstoesse:
                  print("Gate NICHT bestanden:")
                  for eintrag in verstoesse:
                      print(f"  - {eintrag}")
                  ERGEBNIS["text"] = "; ".join(verstoesse)
                  gh("pr", "merge", pr_nr, "--repo", REPO, "--disable-auto", fatal=False)
                  return 1
              print(f"Gate bestanden: PR {pr_nr}, {len(dateien)} Datei(en), HEAD {HEAD_SHA[:8]}.")
              ERGEBNIS["text"] = f"Gate bestanden: {len(dateien)} Datei(en), HEAD {HEAD_SHA[:8]}."
              melde("success", ERGEBNIS["text"])
              ERGEBNIS["melden"] = False
              if not repo.get("allow_auto_merge"):
                  # Sonst wuerde `gh pr merge --auto` einen bereits gruenen PR sofort direkt mergen.
                  print("Auto-Merge ist im Repo nicht erlaubt: keine Integration, Draft-Status unveraendert.")
                  return 0
              if pr.get("draft"):
                  gh("pr", "ready", pr_nr, "--repo", REPO)
              if pr.get("auto_merge"):
                  print("Auto-Merge war schon aktiv; der Check dieses Stands ist trotzdem bestanden.")
                  return 0
              gh("pr", "merge", pr_nr, "--repo", REPO, "--auto", "--squash", "--match-head-commit", HEAD_SHA)
              print("Auto-Merge aktiviert; GitHub merged, sobald alle Pflicht-Checks gruen sind.")
              return 0


          def main():
              code = pruefe()
              if ERGEBNIS["melden"]:
                  melde("success" if code == 0 else "failure", ERGEBNIS["text"] or "ohne Angabe")
              return code


          if __name__ == "__main__":
              sys.exit(main())
          PY
